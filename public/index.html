<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCS Bot · Perguntas</title>
<style>
  :root {
    --marca: #ff5400; --marca-escura: #c74100; --marca-hover: #a83600; --marca-clara: #fff1e8; --anel: #ff7a33;
    --topo: #17191f; --topo-texto: #c9ccd3;
    --fundo: #f4f5f7; --cartao: #fff; --texto: #1b1f27; --suave: #5f6673; --borda: #e3e5e9;
    --azul: #2357d9; --azul-claro: #e8eefc; --verde: #176b3d; --verde-claro: #e5f5ec;
    --amarelo: #8a5700; --amarelo-claro: #fff4dc; --vermelho: #c0392b; --vermelho-claro: #fdecea;
    --sombra: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 80px; }
  button, a, summary { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  :focus-visible { outline: 2px solid var(--anel); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  body { margin: 0; font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
  a { color: var(--marca-escura); }
  header { background: var(--topo); padding: 10px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .marca img { height: 34px; display: block; }
  .marca span { color: #fff; font-weight: 600; font-size: 14px; letter-spacing: .3px; border-left: 1px solid #3a3e48; padding-left: 10px; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; color: var(--topo-texto); }
  nav button:hover { color: #fff; background: rgba(255,255,255,.06); }
  nav button.ativo { background: var(--marca-escura); color: #fff; font-weight: 600; }
  .contador { background: #fff; color: var(--marca-escura); border-radius: 10px; padding: 0 7px; font-size: 12px; margin-left: 4px; font-weight: 700; }
  nav button:not(.ativo) .contador { background: var(--marca-escura); color: #fff; }
  #topo-direita { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--topo-texto); font-size: 12px; }
  #topo-direita button { background: none; border: 1px solid #3a3e48; color: var(--topo-texto); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .status-ml { display: inline-flex; align-items: center; gap: 12px; cursor: default; }
  .ponto { width: 8px; height: 8px; border-radius: 50%; background: #888; display: inline-block; }
  .ponto.ok { background: #2ecc71; } .ponto.erro { background: #e74c3c; } .ponto.atencao { background: #f1c40f; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--sombra); }
  .explica { color: var(--suave); margin: 0 0 12px; }
  .linha { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .entre { justify-content: space-between; }
  .etiqueta { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--azul-claro); color: var(--azul); font-weight: 500; }
  .etiqueta.verde { background: var(--verde-claro); color: var(--verde); }
  .etiqueta.amarela { background: var(--amarelo-claro); color: var(--amarelo); }
  .etiqueta.vermelha { background: var(--vermelho-claro); color: var(--vermelho); }
  .etiqueta.cinza { background: #eef0f3; color: var(--suave); }
  .pergunta { font-size: 17px; font-weight: 600; margin: 6px 0 8px; }
  .suave { color: var(--suave); font-size: 13px; }
  textarea, input, select { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; color: var(--texto); }
  textarea:focus, input:focus, select:focus { outline: 3px solid #ffd2b8; outline-offset: 0; border-color: var(--marca-escura); }
  textarea { min-height: 84px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--suave); margin: 10px 0 4px; }
  button.acao { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--borda); background: #fff; cursor: pointer; color: var(--texto); }
  button.acao:hover { border-color: #c8ccd3; }
  button.principal { background: var(--marca-escura); border-color: var(--marca-escura); color: #fff; font-weight: 600; }
  button.principal:hover { background: var(--marca-hover); border-color: var(--marca-hover); }
  button.acao:disabled { opacity: 1; background: #eef0f3; border-color: var(--borda); color: #5f6673; cursor: not-allowed; font-weight: 500; }
  button.acao[aria-busy=true] { cursor: progress; }
  .vazio { text-align: center; color: var(--suave); padding: 40px 0; }
  .vazio b { display: block; font-size: 17px; color: var(--texto); margin-bottom: 4px; }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .indicadores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .indicador { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; box-shadow: var(--sombra); }
  .indicador .valor { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .indicador .rotulo { font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: .4px; }
  .indicador.destaque .valor { color: var(--marca-escura); }
  @media (max-width: 760px) { button.acao, nav button, .filtros button { min-height: 44px; } textarea, input, select { font-size: 16px; } .grade2 { grid-template-columns: 1fr; } .indicadores { grid-template-columns: 1fr 1fr; } #topo-direita { display: none; } }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filtros button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--borda); background: #fff; cursor: pointer; color: var(--suave); }
  .filtros button.ativo { background: var(--texto); border-color: var(--texto); color: #fff; }
  .card-pergunta { border-left: 4px solid #d0d4da; }
  .card-pergunta.pronta { border-left-color: var(--verde); }
  .card-pergunta.ia { border-left-color: var(--azul); }
  .card-pergunta.humano { border-left-color: #f1c40f; }
  .contagem { font-size: 12px; color: var(--suave); text-align: right; margin-top: 2px; }
  .caixa { background: var(--fundo); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .barra { height: 8px; background: var(--marca-clara); border-radius: 4px; overflow: hidden; }
  .barra > div { height: 100%; background: var(--marca); }
  .aviso { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; border: 1px solid transparent; }
  .aviso.amarelo { background: var(--amarelo-claro); color: var(--amarelo); border-color: #f5e0b0; }
  .aviso.verde { background: var(--verde-claro); color: var(--verde); }
  .aviso.vermelho { background: var(--vermelho-claro); color: var(--vermelho); }
  code { background: var(--fundo); padding: 1px 6px; border-radius: 4px; word-break: break-all; font-size: 13px; }
  details summary { cursor: pointer; }
  details summary b { color: var(--texto); }
  h3 { margin: 18px 0 10px; }
  #entrar { max-width: 380px; margin: 10vh auto; text-align: center; }
  #entrar .logo-login { background: var(--topo); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  #entrar .logo-login img { max-width: 220px; width: 100%; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--topo); color: #fff; padding: 10px 16px; border-radius: 10px; display: none; z-index: 10; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
</style>
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div id="entrar" class="cartao" style="display:none">
  <div class="logo-login"><img src="/logo.png" alt="MCS Brasil"></div>
  <h2 style="margin:0 0 4px">Bot de perguntas</h2>
  <p class="explica">Entre com a senha do painel.</p>
  <form onsubmit="entrar(event)">
    <input type="password" id="senha" placeholder="Senha" aria-label="Senha do painel" autocomplete="current-password" autofocus>
    <div style="margin-top:12px"><button class="acao principal" type="submit">Entrar</button></div>
    <p id="erro-entrar" class="suave" style="color:var(--vermelho)" role="alert"></p>
  </form>
</div>

<div id="app" style="display:none">
  <header>
    <a class="marca" href="/"><img src="/logo.png" alt="MCS Brasil"><span>Bot de perguntas</span></a>
    <nav aria-label="Seções do painel">
      <button data-aba="pendentes" class="ativo">Pendentes <span id="n-pendentes"></span></button>
      <button data-aba="frequentes">Perguntas frequentes</button>
      <button data-aba="prontas">Respostas prontas</button>
      <button data-aba="comparar">Respondidas</button>
      <button data-aba="conexao">Conexão</button>
    </nav>
    <div id="topo-direita"><span class="status-ml" id="status-ml"></span><span id="rodape-versao"></span><button onclick="sair()" aria-label="Sair do painel">Sair</button></div>
  </header>
  <main id="conteudo"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.querySelector(s);
let estado = null;
let assuntos = [];
let aba = 'pendentes';

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000); }
function haQuanto(iso) {
  if (!iso) return '';
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 48) return `há ${h} h`;
  return `há ${Math.round(h / 24)} dias`;
}
function dataBr(iso) { return iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : ''; }

async function api(url, opcoes = {}) {
  const r = await fetch(url, {
    method: opcoes.metodo || 'GET',
    headers: opcoes.corpo !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: opcoes.corpo !== undefined ? JSON.stringify(opcoes.corpo) : undefined,
    credentials: 'same-origin',
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.startsWith('/painel/login')) { mostrarEntrar(); throw new Error(j.mensagem || 'Entre no painel.'); }
  if (!r.ok) throw new Error(j.mensagem || `Erro ${r.status}`);
  return j;
}

function mostrarEntrar() { $('#app').style.display = 'none'; $('#entrar').style.display = 'block'; }
async function entrar(ev) {
  ev.preventDefault();
  try {
    await api('/painel/login', { metodo: 'POST', corpo: { senha: $('#senha').value } });
    $('#entrar').style.display = 'none';
    iniciar();
  } catch (e) { $('#erro-entrar').textContent = e.message; }
}

async function carregarEstado() {
  estado = await api('/api/painel/estado');
  const n = estado.perguntas.pendente || 0;
  $('#n-pendentes').innerHTML = n ? `<span class="contador">${n}</span>` : '';
  $('#rodape-versao').textContent = `v${estado.versao}`;
  const ml = estado.mercadoLivre;
  const iaOk = !estado.ia.falta;
  const item = (ok, cor, rotulo, dica) => `<span title="${esc(dica)}"><span class="ponto ${ok ? 'ok' : cor}"></span> ${rotulo}</span>`;
  $('#status-ml').innerHTML =
    item(ml.conectado, 'erro', 'ML', ml.conectado ? 'Mercado Livre conectado' : 'Mercado Livre desconectado') +
    item(iaOk, 'atencao', 'IA', iaOk ? 'IA ligada' : 'IA sem chave') +
    item(ml.envioHabilitado, 'atencao', 'Envio', ml.envioHabilitado ? 'Envio ligado' : 'Envio desligado: só sugere');
  document.title = n ? `(${n}) MCS Bot · Perguntas` : 'MCS Bot · Perguntas';
}
async function sair() {
  try { await api('/painel/sair', { metodo: 'POST' }); } catch {}
  $('#senha').value = '';
  mostrarEntrar();
}
function contar(el) {
  const c = el.parentElement.querySelector(`.contagem[data-para="${el.id}"]`);
  if (c) c.textContent = `${el.value.length}/2000`;
}
async function copiar(id) {
  const texto = $(`#t-${id}`).value.trim();
  if (!texto) return toast('Não há resposta para copiar.');
  try { await navigator.clipboard.writeText(texto); toast('Resposta copiada. Cole no Mercado Livre.'); }
  catch { $(`#t-${id}`).select(); document.execCommand('copy'); toast('Resposta copiada.'); }
}
function duracao(min) {
  if (min == null) return '–';
  if (min < 60) return `${Math.round(min)} min`;
  if (min < 48 * 60) return `${(min / 60).toFixed(1).replace('.', ',')} h`;
  return `${Math.round(min / 1440)} dias`;
}

async function iniciar() {
  const s = await fetch('/painel/sessao').then((r) => r.json());
  if (!s.logado) return mostrarEntrar();
  $('#app').style.display = 'block';
  assuntos = await api('/api/assuntos');
  await carregarEstado();
  const p = new URLSearchParams(location.search);
  if (p.get('conectado')) { toast('Mercado Livre conectado.'); history.replaceState(null, '', '/'); }
  const inicial = location.hash.slice(1);
  mostrar(['pendentes', 'frequentes', 'prontas', 'comparar', 'conexao'].includes(inicial) ? inicial : aba);
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== aba) mostrar(h); });
  setInterval(() => { if (aba === 'pendentes' && !document.querySelector('textarea:focus')) mostrar('pendentes', true); else carregarEstado(); }, 60_000);
}

document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { history.pushState(null, '', `#${b.dataset.aba}`); mostrar(b.dataset.aba); });
// Botão "ocupado" enquanto espera o servidor (evita clique duplo).
async function ocupado(btn, texto, fn) {
  if (!btn || btn.disabled) return fn();
  const antes = btn.textContent;
  btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = texto;
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.textContent = antes; } }
}

async function mostrar(nome, silencioso) {
  aba = nome;
  if (location.hash.slice(1) !== nome) history.replaceState(null, '', `#${nome}`);
  document.querySelectorAll('nav button').forEach((b) => {
    b.classList.toggle('ativo', b.dataset.aba === nome);
    if (b.dataset.aba === nome) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (!silencioso) $('#conteudo').innerHTML = '<p class="vazio">Carregando…</p>';
  try {
    await carregarEstado();
    const telas = { pendentes: telaPendentes, frequentes: telaFrequentes, prontas: telaProntas, comparar: telaComparar, conexao: telaConexao };
    $('#conteudo').innerHTML = await telas[nome]();
  } catch (e) { $('#conteudo').innerHTML = `<div class="aviso vermelho">${esc(e.message)}</div>`; }
}

function avisosGerais() {
  const ml = estado.mercadoLivre;
  let h = '';
  if (!ml.conectado) h += `<div class="aviso amarelo">O Mercado Livre ainda não está conectado. Vá em <b>Conexão</b> para entrar.</div>`;
  if (estado.ia.falta) h += `<div class="aviso amarelo">IA: ${esc(estado.ia.falta)} Enquanto isso, só as respostas prontas geram sugestão.</div>`;
  return h;
}

function etiquetaOrigem(p) {
  if (p.sugestaoOrigem === 'pronta') return '<span class="etiqueta verde">resposta pronta</span>';
  if (p.sugestaoOrigem === 'ia' && p.sugestao) return `<span class="etiqueta">IA · confiança ${Math.round((p.sugestaoConfianca || 0) * 100)}%</span>`;
  if (p.sugestaoOrigem === 'ia') return '<span class="etiqueta amarela">IA pediu uma pessoa</span>';
  return '<span class="etiqueta amarela">sem sugestão</span>';
}

function linkAnuncio(p) {
  const nome = esc(p.itemTitulo || p.itemId || 'anúncio');
  return p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">${nome}</a>` : nome;
}

// ---------------- Pendentes ----------------
let filtroAssunto = '';
function filtrarAssunto(a) { filtroAssunto = a; mostrar('pendentes', true); }
function classeOrigem(p) {
  if (p.sugestaoOrigem === 'pronta') return 'pronta';
  if (p.sugestaoOrigem === 'ia' && p.sugestao) return 'ia';
  return 'humano';
}
async function telaPendentes() {
  const todas = await api('/api/perguntas?status=pendente&limite=200');
  const envio = estado.mercadoLivre.envioHabilitado;
  let h = avisosGerais();
  const maisAntiga = todas.reduce((m, p) => (!m || p.criadaEm < m ? p.criadaEm : m), null);
  const t = estado.tempoDeResposta30d || {};
  const precisam = todas.filter((p) => classeOrigem(p) === 'humano').length;
  h += `<div class="indicadores">
    <div class="indicador destaque"><div class="rotulo">Pendentes</div><div class="valor">${todas.length}</div><div class="suave">${precisam} sem sugestão boa</div></div>
    <div class="indicador"><div class="rotulo">Mais antiga</div><div class="valor">${maisAntiga ? esc(haQuanto(maisAntiga).replace('há ', '')) : '–'}</div><div class="suave">esperando resposta</div></div>
    <div class="indicador"><div class="rotulo">Tempo de resposta</div><div class="valor">${duracao(t.medianaMin)}</div><div class="suave">mediana, 30 dias (${t.quantidade || 0})</div></div>
    <div class="indicador"><div class="rotulo">Respostas prontas</div><div class="valor">${estado.respostasProntas}</div><div class="suave">ativas</div></div>
  </div>`;
  const porAssunto = {};
  for (const p of todas) porAssunto[p.assunto] = (porAssunto[p.assunto] || 0) + 1;
  if (filtroAssunto && !porAssunto[filtroAssunto]) filtroAssunto = '';
  const lista = filtroAssunto ? todas.filter((p) => p.assunto === filtroAssunto) : todas;
  h += `<div class="cartao"><div class="linha entre"><div>
      <b>${lista.length} pergunta(s) esperando resposta</b>
      <p class="explica" style="margin:4px 0 0">Cada pergunta já vem com uma sugestão: uma resposta pronta, quando alguma casa, ou a IA usando a ficha do anúncio.
      ${envio ? 'Revise e clique em Enviar.' : '<b>O envio está desligado</b> (o Gobots ainda responde): por enquanto o sistema só sugere, para compararmos.'}</p>
    </div><button class="acao" onclick="sincronizar(this)">Buscar agora</button></div></div>`;
  if (!todas.length) return h + `<div class="vazio"><b>Tudo respondido</b>Nenhuma pergunta esperando. O sistema busca novas a cada poucos minutos.</div>`;
  const chaves = Object.keys(porAssunto);
  if (chaves.length > 1) {
    h += `<div class="filtros"><button class="${filtroAssunto ? '' : 'ativo'}" onclick="filtrarAssunto('')">Todas (${todas.length})</button>`;
    for (const k of chaves.sort((a, b) => porAssunto[b] - porAssunto[a])) {
      const nome = todas.find((p) => p.assunto === k)?.assuntoNome || k;
      h += `<button class="${filtroAssunto === k ? 'ativo' : ''}" onclick="filtrarAssunto(${esc(JSON.stringify(k))})">${esc(nome)} (${porAssunto[k]})</button>`;
    }
    h += '</div>';
  }
  for (const p of lista) {
    h += `<div class="cartao card-pergunta ${classeOrigem(p)}" id="p-${p.id}">
      <div class="linha entre"><span class="suave">${linkAnuncio(p)}</span><span class="suave">${haQuanto(p.criadaEm)}</span></div>
      <div class="pergunta">${esc(p.texto)}</div>
      <div class="linha"><span class="etiqueta">${esc(p.assuntoNome)}</span>${etiquetaOrigem(p)}<span class="suave">${esc(p.sugestaoMotivo || '')}</span></div>
      <label for="t-${p.id}">Resposta</label>
      <textarea id="t-${p.id}" maxlength="2000" oninput="contar(this)">${esc(p.sugestao || '')}</textarea>
      <div class="contagem" data-para="t-${p.id}">${(p.sugestao || '').length}/2000</div>
      <div class="linha" style="margin-top:6px">
        <button class="acao principal" onclick="enviar(${p.id}, this)" ${envio ? '' : 'disabled title="Envio desligado (ML_ENVIO_HABILITADO)"'}>Enviar ao Mercado Livre</button>
        ${envio ? '' : `<button class="acao" onclick="copiar(${p.id})">Copiar resposta</button>`}
        <button class="acao" onclick="refazer(${p.id}, this)">Refazer sugestão</button>
        <button class="acao" onclick="novaProntaDe(${esc(JSON.stringify({ texto: p.texto, resposta: p.sugestao || "", assunto: p.assunto, itemId: p.itemId }))})">Virar resposta pronta</button>
      </div></div>`;
  }
  return h;
}

async function sincronizar(btn) {
  await ocupado(btn, 'Buscando…', async () => {
    try {
      const r = await api('/api/sincronizar', { metodo: 'POST' });
      toast(r.erro ? `Falhou: ${r.erro}` : `${r.pendentes} pendente(s), ${r.novas} nova(s), ${r.resolvidasFora} respondida(s) por fora.`);
      await mostrar('pendentes', true);
    } catch (e) { toast(e.message); }
  });
}
async function refazer(id, btn) {
  await ocupado(btn, 'Montando…', async () => {
    try { await api(`/api/perguntas/${id}/sugestao`, { metodo: 'POST' }); await mostrar('pendentes', true); } catch (e) { toast(e.message); }
  });
}
async function enviar(id, btn) {
  const texto = $(`#t-${id}`).value.trim();
  if (!texto) return toast('Escreva a resposta antes de enviar.');
  if (!confirm('Enviar esta resposta ao Mercado Livre? Ela fica pública no anúncio.')) return;
  await ocupado(btn, 'Enviando…', async () => {
    try { await api(`/api/perguntas/${id}/responder`, { metodo: 'POST', corpo: { texto } }); toast('Resposta enviada.'); await mostrar('pendentes', true); }
    catch (e) { toast(e.message); }
  });
}

// ---------------- Frequentes ----------------
async function telaFrequentes() {
  const hist = estado.historico;
  const f = await api('/api/frequentes');
  let h = avisosGerais();
  h += `<div class="cartao"><div class="linha entre"><div>
      <b>De onde vem esta lista</b>
      <p class="explica" style="margin:4px 0 0">Do histórico de perguntas já respondidas no Mercado Livre (inclui o que o Gobots respondeu). O sistema agrupa por assunto e junta perguntas parecidas. Em cada grupo aparece a resposta mais usada, que você pode transformar em resposta pronta com um clique.</p>
      <p class="suave" style="margin:6px 0 0">${hist.rodando ? `Importando… ${hist.lidas} perguntas lidas até agora.` :
        hist.fim ? `Última importação: ${dataBr(hist.fim)}, ${hist.lidas} perguntas${hist.parouPor ? ` (${esc(hist.parouPor)})` : ''}.${hist.erro ? ` <span style="color:var(--vermelho)">Erro: ${esc(hist.erro)}</span>` : ''}` :
        'O histórico ainda não foi importado.'}</p>
    </div><button class="acao principal" onclick="importar()" ${hist.rodando || !estado.mercadoLivre.conectado ? 'disabled' : ''}>${hist.fim ? 'Importar de novo' : 'Importar histórico'}</button></div></div>`;
  if (hist.rodando) setTimeout(() => aba === 'frequentes' && mostrar('frequentes', true), 5000);
  if (!f.total) return h + '<div class="vazio"><b>Ainda sem histórico</b>Clique em Importar histórico acima para trazer as perguntas já respondidas no Mercado Livre.</div>';
  h += `<p class="suave">${f.total} perguntas respondidas analisadas.</p>`;
  for (const a of f.assuntos) {
    h += `<div class="cartao"><div class="linha entre"><b>${esc(a.nome)}</b><span class="suave">${a.quantidade} perguntas · ${a.percentual}%</span></div>
      <div class="barra" style="margin:8px 0 4px"><div style="width:${Math.min(100, a.percentual)}%"></div></div>
      <details ${f.assuntos.indexOf(a) < 2 ? 'open' : ''}><summary>Ver os ${a.grupos.length} grupos mais comuns</summary>`;
    for (const g of a.grupos) {
      h += `<div style="border-top:1px solid var(--borda);padding-top:10px;margin-top:10px">
        <div class="linha entre"><b>${g.quantidade}× parecidas</b><span class="suave">gatilho sugerido: <code>${esc(g.gatilhoSugerido)}</code></span></div>
        <ul style="margin:6px 0">${g.exemplos.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>
        ${g.respostaMaisUsada ? `<div class="suave">Resposta mais usada (${g.vezesDaResposta}×):</div><div class="caixa">${esc(g.respostaMaisUsada)}</div>` : ''}
        <div style="margin-top:8px"><button class="acao" onclick="novaProntaDe(${esc(JSON.stringify({ texto: g.exemplos[0], resposta: g.respostaMaisUsada || "", assunto: a.assunto, gatilho: g.gatilhoSugerido }))})">Virar resposta pronta</button></div>
      </div>`;
    }
    h += '</details></div>';
  }
  return h;
}

async function importar() {
  try { await api('/api/historico/importar', { metodo: 'POST' }); toast('Importação começou. Pode levar alguns minutos.'); mostrar('frequentes', true); }
  catch (e) { toast(e.message); }
}

// ---------------- Respostas prontas ----------------
let rascunho = null;

function novaProntaDe(d) {
  rascunho = {
    titulo: (d.texto || '').slice(0, 60),
    assunto: d.assunto || '',
    gatilhos: d.gatilho ? [d.gatilho] : [],
    texto: (d.resposta || '').replace(/^(ol[aá]!?\s*)/i, ''),
    escopo: 'geral',
  };
  mostrar('prontas');
}

function opcoesAssunto(sel) {
  return '<option value="">(sem assunto)</option>' + assuntos.map((a) => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.nome)}</option>`).join('');
}

function formPronta(r) {
  r = r || { titulo: '', assunto: '', gatilhos: [], texto: '', escopo: 'geral', ativa: true };
  return `<form onsubmit="salvarPronta(event, ${r.id || 'null'})">
    <label>Nome (só para você achar depois)</label><input name="titulo" value="${esc(r.titulo)}" required>
    <div class="grade2">
      <div><label>Assunto</label><select name="assunto">${opcoesAssunto(r.assunto)}</select></div>
      <div><label>Vale para</label><input name="escopo" value="${esc(r.escopo === 'geral' ? 'geral' : r.escopo)}" placeholder="geral, ou o código do anúncio (MLB...)"></div>
    </div>
    <label>Gatilhos: um por linha. A resposta é usada quando a pergunta tem TODAS as palavras de um gatilho, em qualquer ordem.</label>
    <textarea name="gatilhos" style="min-height:70px" placeholder="nota fiscal&#10;emite nf">${esc((r.gatilhos || []).join('\n'))}</textarea>
    <label>Texto da resposta. Pode usar {titulo}, {preco} (o de agora, com promoção), {preco_cheio}, {estoque}, {garantia}. Com {garantia|outro texto}, o outro texto entra quando o anúncio não tiver o dado. A saudação e a assinatura entram sozinhas.</label>
    <textarea name="texto" maxlength="2000" required>${esc(r.texto)}</textarea>
    <label class="linha" style="color:var(--texto)"><input type="checkbox" name="ativa" style="width:auto" ${r.ativa !== false ? 'checked' : ''}> Ativa</label>
    <div class="linha" style="margin-top:8px"><button class="acao principal" type="submit">Salvar</button>
      ${r.id ? `<button class="acao" type="button" onclick="apagarPronta(${r.id})">Apagar</button>` : ''}</div>
  </form>`;
}

async function telaProntas() {
  const [lista, regras] = await Promise.all([api('/api/respostas-prontas'), api('/api/regras-da-loja')]);
  let h = `<div class="cartao"><b>Regras da loja</b>
    <p class="explica">Valem para todos os anúncios: horário de envio, retirada, troca... A IA lê este texto antes de responder, então mudar aqui muda as respostas na hora. Escreva como explicaria para um atendente novo.</p>
    <textarea id="regras-loja" style="min-height:200px">${esc(regras.texto)}</textarea>
    <div class="linha" style="margin-top:8px"><button class="acao principal" onclick="salvarRegras()">Salvar regras</button>
      <button class="acao" onclick="regrasPadrao()">Voltar ao texto inicial</button></div></div>`;
  window._regrasPadrao = regras.padrao;
  if (!lista.length) {
    h += `<div class="aviso amarelo">Ainda não há respostas prontas. <button class="acao" onclick="carregarIniciais()">Carregar as da planilha do Gobots (9 respostas)</button></div>`;
  }
  h += `<div class="cartao"><b>${rascunho ? 'Nova resposta pronta (a partir de uma pergunta)' : 'Nova resposta pronta'}</b>
    <p class="explica">Respostas prontas vencem a IA: se uma casa com a pergunta, é ela que vira a sugestão. A do anúncio específico vence a geral.</p>
    ${formPronta(rascunho)}</div>`;
  rascunho = null;
  h += `<div class="cartao"><b>Testar</b><p class="explica">Escreva uma pergunta para ver qual resposta pronta seria usada.</p>
    <div class="grade2"><input id="teste-texto" placeholder="Ex.: vocês emitem nota fiscal?"><input id="teste-item" placeholder="Anúncio (opcional, MLB...)"></div>
    <div class="linha" style="margin-top:8px"><button class="acao" onclick="testar()">Testar</button><span id="teste-resultado" class="suave"></span></div></div>`;
  h += `<div class="linha entre"><h3>${lista.length} resposta(s) pronta(s)</h3>${lista.length ? '<button class="acao" onclick="carregarIniciais()">Carregar as da planilha (só as que faltam)</button>' : ''}</div>`;
  for (const r of lista) {
    h += `<div class="cartao"><details><summary><b>${esc(r.titulo)}</b>
      ${r.ativa ? '' : '<span class="etiqueta vermelha">desativada</span>'}
      <span class="etiqueta">${esc(r.escopo === 'geral' ? 'geral' : r.escopo)}</span>
      <span class="suave">usada ${r.usos}× · gatilhos: ${r.gatilhos.map(esc).join(' | ')}</span></summary>
      ${formPronta(r)}</details></div>`;
  }
  return h;
}

async function salvarRegras() {
  try { await api('/api/regras-da-loja', { metodo: 'PUT', corpo: { texto: $('#regras-loja').value } }); toast('Regras da loja salvas. A IA já usa o texto novo.'); }
  catch (e) { toast(e.message); }
}
function regrasPadrao() {
  if (confirm('Trocar o texto pelas regras iniciais? (só salva quando você clicar em Salvar regras)')) $('#regras-loja').value = window._regrasPadrao || '';
}
async function carregarIniciais() {
  try {
    const r = await api('/api/respostas-prontas/carregar-iniciais', { metodo: 'POST' });
    toast(`${r.criadas} resposta(s) criada(s)` + (r.jaExistiam.length ? `, ${r.jaExistiam.length} já existiam` : '') + (r.pendentesAtualizadas ? `, usadas em ${r.pendentesAtualizadas} pendente(s)` : '') + '.');
    mostrar('prontas', true);
  } catch (e) { toast(e.message); }
}

async function salvarPronta(ev, id) {
  ev.preventDefault();
  const f = ev.target;
  const corpo = {
    titulo: f.titulo.value, assunto: f.assunto.value || null, escopo: f.escopo.value || 'geral',
    gatilhos: f.gatilhos.value.split('\n').map((s) => s.trim()).filter(Boolean), texto: f.texto.value, ativa: f.ativa.checked,
  };
  try {
    const r = await api(id ? `/api/respostas-prontas/${id}` : '/api/respostas-prontas', { metodo: id ? 'PUT' : 'POST', corpo });
    toast(r.pendentesAtualizadas ? `Resposta pronta salva e usada em ${r.pendentesAtualizadas} pergunta(s) pendente(s).` : 'Resposta pronta salva.');
    mostrar('prontas', true);
  } catch (e) { toast(e.message); }
}
async function apagarPronta(id) {
  if (!confirm('Apagar esta resposta pronta?')) return;
  await api(`/api/respostas-prontas/${id}`, { metodo: 'DELETE' }); mostrar('prontas', true);
}
async function testar() {
  const r = await api('/api/respostas-prontas/testar', { metodo: 'POST', corpo: { texto: $('#teste-texto').value, itemId: $('#teste-item').value } });
  $('#teste-resultado').textContent = `Assunto: ${r.assuntoNome}. ` + (r.casou ? `Usaria "${r.casou.titulo}" (gatilho: ${r.casou.gatilho}).` : 'Nenhuma resposta pronta casa: iria para a IA.');
}

// ---------------- Respondidas / comparação ----------------
async function telaComparar() {
  const lista = await api('/api/perguntas?status=respondida&comSugestao=1&limite=100');
  let h = `<div class="cartao"><b>O que foi respondido × o que o sistema sugeriu</b>
    <p class="explica" style="margin:4px 0 0">Enquanto o Gobots continua ligado, cada pergunta que ele (ou alguém) responde aparece aqui ao lado da nossa sugestão. É assim que decidimos quando dá para desligar o Gobots e ligar o envio.</p></div>`;
  if (!lista.length) return h + '<div class="vazio"><b>Nada para comparar ainda</b>Aqui aparecem as perguntas que o Gobots (ou alguém) respondeu e para as quais o bot também deu sugestão.</div>';
  for (const p of lista) {
    const quem = { externo: 'Gobots / fora do sistema', painel: 'pelo painel', 'mcs-bot': 'automático' }[p.respondidaPor] || p.respondidaPor;
    h += `<div class="cartao"><div class="linha entre"><span class="suave">${linkAnuncio(p)}</span><span class="suave">${dataBr(p.criadaEm)}</span></div>
      <div class="pergunta">${esc(p.texto)}</div>
      <div class="grade2">
        <div><div class="suave">Respondido ${esc(quem)} ${p.respondidaEm ? `(${tempoEntre(p.criadaEm, p.respondidaEm)})` : ''}</div><div class="caixa">${esc(p.resposta || '')}</div></div>
        <div><div class="suave">Nossa sugestão ${etiquetaOrigem(p)}</div><div class="caixa">${esc(p.sugestao || p.sugestaoMotivo || '')}</div></div>
      </div></div>`;
  }
  return h;
}
function tempoEntre(a, b) {
  const min = Math.round((Date.parse(b) - Date.parse(a)) / 60000);
  return min < 60 ? `em ${min} min` : `em ${Math.round(min / 60)} h`;
}

// ---------------- Conexão ----------------
async function telaConexao() {
  const ml = estado.mercadoLivre;
  const t = estado.tempoDeResposta30d;
  const s = estado.ultimaSincronizacao;
  return `<div class="cartao"><b>Mercado Livre</b>
    <p>${ml.conectado ? `<span class="etiqueta verde">conectado</span> conta ${esc(ml.userId)}` : '<span class="etiqueta vermelha">não conectado</span>'}
       ${ml.appConfigurado ? '' : ' <span class="etiqueta vermelha">faltam ML_CLIENT_ID e ML_CLIENT_SECRET</span>'}</p>
    <p><a class="acao principal" style="text-decoration:none;display:inline-block;padding:8px 14px;border-radius:8px;background:var(--azul);color:#fff" href="/oauth/ml/login">${ml.conectado ? 'Conectar de novo' : 'Conectar ao Mercado Livre'}</a></p>
    <p class="explica">No app do Mercado Livre (developers.mercadolivre.com.br) configure:</p>
    <ul>
      <li>URI de redirect: <code>${esc(ml.enderecoDeRetorno)}</code></li>
      <li>URL de retorno de notificações: <code>${esc(ml.enderecoDeAvisos)}</code></li>
      <li>Tópicos: <b>Questions</b> (perguntas). Permissões: perguntas e anúncios.</li>
    </ul>
    <p>Envio de respostas: ${ml.envioHabilitado ? '<span class="etiqueta verde">ligado</span>' : '<span class="etiqueta amarela">desligado</span> (ML_ENVIO_HABILITADO=false: só sugere)'}</p>
    <p class="suave">Última busca de pendentes: ${s ? `${dataBr(s.em)} — ${s.pendentes} pendente(s)${s.erro ? `, erro: ${esc(s.erro)}` : ''}` : 'ainda não rodou'}</p>
  </div>
  <div class="cartao"><b>IA</b>
    <p>${estado.ia.configurada ? `<span class="etiqueta verde">configurada</span> ${esc(estado.ia.provedor)} · modelo: ${esc(estado.ia.modelo)}` : '<span class="etiqueta amarela">não configurada</span>'}</p>
    ${estado.ia.falta ? `<p class="suave">${esc(estado.ia.falta)}</p>` : ''}
  </div>
  <div class="cartao"><b>Últimos 30 dias</b>
    <p>${t.quantidade} perguntas respondidas · tempo mediano até a resposta: ${t.medianaMin != null ? `${t.medianaMin} min` : '—'}</p>
    <p class="suave">Quem respondeu: ${Object.entries(t.porQuem).map(([k, v]) => `${esc({ externo: 'Gobots/fora', painel: 'painel', 'mcs-bot': 'automático' }[k] || k)}: ${v}`).join(' · ') || '—'}</p>
    <p class="suave">No banco: ${estado.perguntas.pendente} pendentes, ${estado.perguntas.respondida} respondidas, ${estado.perguntas.fechada} fechadas · ${estado.respostasProntas} respostas prontas ativas.</p>
  </div>`;
}

iniciar().catch((e) => toast(e.message));
</script>
